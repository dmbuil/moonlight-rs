# Markdown lint/format config for rumdl (`rumdl check .`, `rumdl fmt .`).
[global]
# LICENSE.md is the verbatim Apache 2.0 text: never reformat it.
exclude = ["target", "LICENSE.md"]

[MD013]
line-length = 100
code-blocks = false
tables = false

[MD033]
# The README header: a centred block (div) and a logo with a size, which Markdown can't give.
allowed-elements = ["div", "img"]
