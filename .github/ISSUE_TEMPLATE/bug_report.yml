name: Bug report
description: Something in Moonlight is broken or behaves differently from Horizon.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Before you submit:

        - **Redact secrets.** Never paste tokens, passwords, `cookie_key`, session cookies,
          application-credential secrets or internal hostnames you can't share.
        - **Security problems** (bypassing `[writes] mode`, token leaks, auth issues) must not
          be filed here: use *Security › Report a vulnerability* instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed tokens, passwords and other secrets from everything below.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, short description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The page URL path (e.g. `/project/instances`) and what you clicked.
      placeholder: |
        1. Go to /project/instances
        2. Open the row menu of an instance and pick "Resize"
        3. Submit the dialog
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected. If Horizon does it differently, say what Horizon shows.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sign-in / session (password, WebSSO, logout)
        - Project › Compute
        - Project › Volumes
        - Project › Network
        - Project › Orchestration / Key Manager / other plugins
        - Admin dashboard
        - Identity
        - Dialogs / write actions
        - Layout, styling or dark mode
        - Translations (English / Spanish)
        - Configuration / start-up
        - Container image / deployment
        - Other
    validations:
      required: true

  - type: dropdown
    id: writes
    attributes:
      label: "`[writes] mode`"
      description: As set in `moonlight.conf` or `MOONLIGHT_WRITES`.
      options:
        - dry-run
        - "off"
        - "on"
        - Not relevant / don't know
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Moonlight version or commit
      description: "`git rev-parse --short HEAD`, or the container image tag."
      placeholder: "0.1.0 / 55ba928"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How do you run it?
      options:
        - cargo leptos watch (dev)
        - Release build (cargo leptos build --release)
        - Container image (Podman / Docker)
        - Other
    validations:
      required: true

  - type: input
    id: openstack
    attributes:
      label: OpenStack release / distribution
      placeholder: "e.g. RHOSO 18, Caracal (2024.1), DevStack master"

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "e.g. Firefox 140 on Linux, Chrome 142 on macOS"

  - type: dropdown
    id: lang
    attributes:
      label: UI language
      options:
        - English
        - Spanish
        - Both / not relevant

  - type: textarea
    id: server_logs
    attributes:
      label: Server log
      description: |
        Lines around the failure from stdout or `[log] file`. For more detail, restart with
        `RUST_LOG=moonlight=debug`. Check them for tokens before pasting.
      render: text

  - type: textarea
    id: browser_logs
    attributes:
      label: Browser console / network
      description: Errors from the developer console, and the failing `/api/…` request if any.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: |
        Only the sections that matter (e.g. `[ui]`, `[plugins]`, `[images]`). **Remove
        `cookie_key`, client secrets and passwords.**
      render: toml

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images here. Mention whether it worked in an earlier version.
