# cargo-deny policy: `cargo deny check` runs in AGENTS.md §2 and in CI.
# Every dependency comes from crates.io; a vulnerable or yanked crate fails the check;
# licences must be on the allow list below; duplicate versions only warn (see
# `bans.multiple-versions`), since the OpenStack SDK and Leptos pin different rand/sha2 lines.

[graph]
# Resolve the server (`ssr`) and browser (`hydrate`) dependency graphs together.
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Advisories to ignore, each with a reason and what would let us drop the entry.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "`paste` is unmaintained but is a build-time proc-macro reached only through leptos → either_of; goes away when Leptos drops it" },
]

[licenses]
# Everything in the graph on 2026-11-11 is permissive. MPL-2.0 (option-ext) is file-level
# copyleft and compatible with Apache-2.0 distribution; CDLA-Permissive-2.0 covers the
# bundled Mozilla root certificates (webpki-root-certs).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Crates that must never enter the graph (e.g. a second TLS stack next to rustls):
deny = [
  { crate = "openssl", reason = "TLS is rustls (openstack_sdk `rustls`, reqwest `rustls-tls`); a second stack doubles the audit surface" },
  { crate = "native-tls", reason = "same as openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
