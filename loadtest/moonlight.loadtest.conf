# Moonlight against the fake OpenStack (loadtest/src/bin/fake_openstack.rs), for load tests only.
# Never use it instead of ./moonlight.conf for the dev server. See loadtest/README.md.

[keystone]
url = "http://127.0.0.1:5000/identity"
default_domain = "Default"
# Set, as production configurations do. Unset, each sign-in builds its scoped connection twice
# (once without a region, then for the catalog's first region): see ROADMAP.md, item 120.
default_region = "RegionOne"
interface = "public"

[session]
# Empty: a random key per process (sessions end on restart, which a load test doesn't mind).
cookie_key = ""
# The load test speaks plain HTTP.
secure_cookies = false
revoke_on_logout = false

[writes]
# The fake OpenStack answers 405 to every write anyway.
mode = "dry-run"

[login]
# Every Goose user signs in once; a run with many users must not be throttled.
max_failures = 0

[cache]
# 30 = warm (the default); run once more with 0 for a cold cache.
lookup_seconds = 30

[log]
# Info logs one line per request; keep it, as production does, so it is part of the cost.
filter = "moonlight=info,openstack_sdk=warn"
stdout = true
